[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-football-fee"
version = "0.1.0"
description = "Football Player Crowd-Sourced Market Value Predictor (XGBoost, TreeSHAP, Conformal Intervals, FastAPI, Redis, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2.0,<4.0.0",
    "pyarrow>=15.0.0,<28.0.0",
    "duckdb>=1.0.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "xgboost>=2.0.3,<4.0.0",
    "lightgbm>=4.3.0,<5.0.0",
    "optuna>=3.6.0,<6.0.0",
    "shap>=0.45.0,<1.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "sqlalchemy>=2.0.29,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "psycopg[binary]>=3.1.18,<4.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "redis>=5.0.4,<9.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "rapidfuzz>=3.8.1,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<10.0.0",
    "pytest-asyncio>=0.23.6,<2.0.0",
    "fakeredis>=2.23.0,<3.0.0",
    "ruff>=0.4.2,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "data: tests that validate local gitignored Parquet lakehouse artifacts (skipped on clean clone)",
    "db: tests that need the local Postgres from `make db` (skipped when it is unreachable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
